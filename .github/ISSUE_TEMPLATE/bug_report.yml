name: Bug Report
description: Report a problem with Rewindpix
title: "[Bug] "
labels: ["bug", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Rewindpix!

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Rewindpix Camera
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. iPhone 17 Pro / Pixel 10"

  - type: input
    id: version
    attributes:
      label: Rewindpix App version
      placeholder: "e.g. 2.3.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Rewindpix
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots / videos
      description: Drag screenshots or screen recordings here.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed personal/private information from my report.
          required: true