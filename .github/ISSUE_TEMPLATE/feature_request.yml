name: Feature Request
description: Suggest an idea for Rewindpix
labels: ["feature", "user submitted"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I often find myself..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like Rewindpix to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - General
        - Darkroom
        - Custom Films
        - Creative Lab
        - iOS app
        - Android app
        - Other
